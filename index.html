<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>אחרון שורד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0d1012;--panel:rgba(14,17,15,.62);--line:rgba(217,199,160,.22);--text:#f1ece0;--muted:#a9a594;--sand:#d9c7a0;--olive:#7d8a52;--hp:#7fd35a;--shield:#45b4ff;--storm:#a45cff;--danger:#ff5a4a;--gold:#f2b84b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1012;--text:#f1ece0}}
:root[data-theme="dark"]{--bg:#0d1012;--text:#f1ece0}
:root[data-theme="light"]{--bg:#0d1012;--text:#f1ece0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;pointer-events:none;z-index:5;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#hudRoot{display:none}
body.playing #hudRoot{display:block}
#stats{top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;direction:rtl;align-items:flex-start}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-weight:600;font-size:14px;white-space:nowrap}
.chip b{font-weight:900}
#statRow{display:flex;gap:6px}
#stormChip{color:#e3cfff}
#killfeed{top:calc(118px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:3px;align-items:flex-start;max-width:46vw}
#killfeed div{background:rgba(0,0,0,.45);padding:2px 8px;border-radius:4px;font-size:13px;animation:kf 5s forwards}
@keyframes kf{0%{opacity:0}5%{opacity:1}80%{opacity:1}100%{opacity:0}}
#minimap{top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:150px;height:150px;border-radius:8px;border:2px solid var(--line);background:#000;pointer-events:auto}
#minimap.big{width:min(86vmin,560px);height:min(86vmin,560px);top:50%;right:50%;transform:translate(50%,-50%);z-index:20}
#crosshair{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#crosshair::before,#crosshair::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#crosshair::before{left:10px;top:2px;width:2px;height:18px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
#crosshair::after{top:10px;left:2px;height:2px;width:18px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%)}
#crosshair.hit::before,#crosshair.hit::after{background:var(--danger)}
#crosshair.head::before,#crosshair.head::after{background:var(--gold)}
#bottom{left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;direction:ltr}
#bars{display:flex;flex-direction:column;gap:3px;width:min(300px,44vw)}
.bar{height:12px;background:rgba(0,0,0,.5);border-radius:3px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.bar i{position:absolute;inset:0;width:100%;transform-origin:left;transition:transform .15s}
.bar span{position:absolute;inset:0;font-size:10px;line-height:11px;font-weight:800;text-align:center;color:#fff}
#shBar i{background:linear-gradient(#6cc8ff,#2c8fd8)}
#hpBar i{background:linear-gradient(#9be36f,#4ea832)}
#hotbar{display:flex;gap:5px}
.slot{width:64px;height:52px;background:var(--panel);border:2px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;pointer-events:auto;line-height:1.15;text-align:center;direction:rtl}
.slot .ic{font-size:18px}
.slot.on{border-color:var(--sand);background:rgba(217,199,160,.22)}
.slot.empty{opacity:.45}
.slot small{font-weight:800;font-size:11px}
#inv{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px;direction:rtl}
#inv .chip{pointer-events:auto}
#prompt{left:50%;top:62%;transform:translateX(-50%);background:var(--panel);padding:5px 14px;border-radius:6px;border:1px solid var(--line);font-weight:600;display:none;direction:rtl}
#buildInfo{left:50%;top:calc(50% + 30px);transform:translateX(-50%);font-weight:800;font-size:14px;color:var(--sand);display:none}
#healProg{left:50%;top:calc(50% + 46px);transform:translateX(-50%);width:160px;display:none}
#healProg .bar{height:8px}
#healProg i{background:var(--hp)}
#msg{left:50%;top:24%;transform:translateX(-50%);font-size:clamp(20px,4vw,34px);font-weight:900;text-align:center;opacity:0;transition:opacity .3s;max-width:90vw;direction:rtl}
#msg.show{opacity:1}
#msg small{display:block;font-size:.5em;font-weight:600;color:var(--sand)}
.dmgnum{position:fixed;font-weight:900;font-size:16px;pointer-events:none;z-index:6;color:#fff;text-shadow:0 1px 3px #000;transform:translate(-50%,-50%);transition:transform .6s ease-out,opacity .6s}
.overlay{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .25s}
#stormTint{background:radial-gradient(circle,rgba(130,60,220,.15),rgba(110,40,200,.55))}
#dmgFlash{background:radial-gradient(circle,transparent 45%,rgba(220,30,20,.55));transition:opacity .4s}
#glassTint{background:rgba(255,190,90,.08);mix-blend-mode:screen}
#scope{background:radial-gradient(circle at center,transparent 0,transparent 32vmin,#000 33vmin);transition:none}
#scope::before,#scope::after{content:"";position:absolute;background:rgba(0,0,0,.85)}
#scope::before{left:50%;top:0;bottom:0;width:1px}
#scope::after{top:50%;left:0;right:0;height:1px}
/* screens */
.screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,rgba(8,10,9,.35),rgba(8,10,9,.85));overflow:auto}
.card{max-width:520px;width:100%;direction:rtl}
.title{font-weight:900;font-size:clamp(46px,11vw,92px);line-height:.9;letter-spacing:-.02em;color:var(--sand);margin:0 0 6px;text-shadow:0 3px 0 #3d3a28,0 8px 30px rgba(0,0,0,.6)}
.sub{color:var(--text);font-size:17px;margin:0 0 18px;opacity:.9}
.controls{background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.7;margin-bottom:18px}
.controls kbd{display:inline-block;min-width:22px;padding:0 6px;border-radius:4px;background:#2b2e25;border:1px solid #57553f;font-family:inherit;font-weight:800;font-size:12px;text-align:center;color:var(--sand)}
.btn{font-family:inherit;font-weight:900;font-size:22px;padding:12px 34px;border-radius:8px;border:none;background:var(--sand);color:#1b1a12;cursor:pointer;box-shadow:0 4px 0 #8a7c58}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a7c58}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
#endScreen{display:none}
#endTitle{font-size:clamp(40px,9vw,72px)}
.endStats{font-size:20px;margin:6px 0 20px;font-weight:600}
#lockHint{display:none;position:fixed;inset:0;z-index:25;align-items:center;justify-content:center;background:rgba(0,0,0,.4);font-size:22px;font-weight:800;cursor:pointer}
#rotateHint{display:none;position:fixed;left:50%;bottom:30%;transform:translateX(-50%);z-index:26;background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;pointer-events:none}
@media (orientation:portrait){body.touch.playing #rotateHint{display:block}}
/* touch controls */
#touchUI{display:none}
body.touch.playing #touchUI{display:block}
#joyBase{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.18);display:none;z-index:7;pointer-events:none;transform:translate(-50%,-50%)}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.45)}
.tbtn{position:fixed;z-index:7;border-radius:50%;background:rgba(20,22,18,.5);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:auto;touch-action:none}
.tbtn.on{background:rgba(217,199,160,.55);color:#1b1a12}
#tFire{width:84px;height:84px;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));font-size:30px;background:rgba(200,60,40,.45)}
#tJump{width:62px;height:62px;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#tAim{width:52px;height:52px;right:calc(122px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#tReload{width:48px;height:48px;right:calc(98px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px))}
#tBuild{width:52px;height:52px;right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px))}
#tUse{width:58px;height:58px;right:calc(150px + env(safe-area-inset-right,0px));bottom:calc(210px + env(safe-area-inset-bottom,0px));display:none;font-size:15px}
#buildBar{position:fixed;z-index:7;right:calc(200px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));display:none;gap:6px}
#buildBar.show{display:flex}
#buildBar .tbtn{position:static;width:54px;height:54px;border-radius:10px;font-size:13px}
body.touch #inv{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));right:calc(172px + env(safe-area-inset-right,0px))}
body.touch #minimap{width:120px;height:120px}
body.touch #minimap.big{width:min(86vmin,560px);height:min(86vmin,560px)}
body.touch #bottom{left:calc(50% - 20px)}
body.touch .slot{width:54px;height:46px}
@media (prefers-reduced-motion:reduce){#killfeed div{animation:none}.dmgnum{transition:none}}
</style>
</head>
<body>
<div id="game"></div>

<div id="hudRoot">
  <div id="stats" class="hud">
    <div id="statRow"><div class="chip">👤 <b id="aliveN">21</b></div><div class="chip">💀 <b id="killN">0</b></div></div>
    <div class="chip" id="stormChip">🌀 —</div>
    <div class="chip" id="dayChip">☀️ —</div>
  </div>
  <div id="killfeed" class="hud"></div>
  <canvas id="minimap" class="hud" width="300" height="300"></canvas>
  <div id="crosshair" class="hud"></div>
  <div id="buildInfo" class="hud"></div>
  <div id="healProg" class="hud"><div class="bar"><i id="healFill"></i></div></div>
  <div id="prompt" class="hud"></div>
  <div id="msg" class="hud"></div>
  <div id="bottom" class="hud">
    <div id="bars">
      <div class="bar" id="shBar"><i></i><span>0</span></div>
      <div class="bar" id="hpBar"><i></i><span>100</span></div>
    </div>
    <div id="hotbar"></div>
  </div>
  <div id="inv" class="hud">
    <div class="chip" id="woodC">🪵 0</div>
    <div class="chip" id="stoneC">🪨 0</div>
    <div class="chip" id="bandC" data-act="bandage">🩹 0</div>
    <div class="chip" id="potC" data-act="shieldpot">🧪 0</div>
    <div class="chip" id="glassC" style="display:none">🕶️</div>
  </div>
</div>

<div id="stormTint" class="overlay"></div>
<div id="dmgFlash" class="overlay"></div>
<div id="glassTint" class="overlay"></div>
<div id="scope" class="overlay"></div>

<div id="touchUI">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tbtn" id="tFire" data-btn="fire">🔫</div>
  <div class="tbtn" id="tJump" data-btn="jump">⤒</div>
  <div class="tbtn" id="tAim" data-btn="aim">🎯</div>
  <div class="tbtn" id="tReload" data-btn="reload">⟳</div>
  <div class="tbtn" id="tBuild" data-btn="build">🧱</div>
  <div class="tbtn" id="tUse" data-btn="use">✋</div>
  <div id="buildBar">
    <div class="tbtn" data-piece="wall">קיר</div>
    <div class="tbtn" data-piece="floor">רצפה</div>
    <div class="tbtn" data-piece="ramp">רמפה</div>
    <div class="tbtn" data-piece="roof">גג</div>
  </div>
</div>

<div id="rotateHint">סובב את הטלפון לרוחב 📱↻</div>
<div id="lockHint">לחץ כדי לחזור למשחק</div>

<div id="menu" class="screen">
  <div class="card">
    <h1 class="title">אחרון<br>שורד</h1>
    <p class="sub">קופצים מהמטוס, אוספים נשקים, בונים ושורדים מול 20 יריבים. רק אחד נשאר.</p>
    <div class="controls" id="ctrlText"></div>
    <button class="btn" id="startBtn">התחל משחק</button>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="card" style="text-align:center">
    <h1 class="title" id="endTitle">ניצחון</h1>
    <div class="endStats" id="endStats"></div>
    <button class="btn" id="againBtn">שחק שוב</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints>0);
if(isTouch) document.body.classList.add('touch');
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
function approachAngle(a,b,s){const d=angleDiff(a,b);return a+clamp(d,-s,s);}
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

$('ctrlText').innerHTML = isTouch
 ? 'ג׳ויסטיק שמאלי: תזוזה • גרירה בצד ימין: הסתכלות<br>🔫 ירי • ⤒ קפיצה (וקפיצה מהמטוס) • 🎯 כוונת • ⟳ טעינה<br>🧱 מצב בנייה ואז בחר קיר / רצפה / רמפה / גג ולחץ 🔫 כדי לבנות<br>לחיצה על המשבצות למטה מחליפה נשק • 🩹 🧪 למעלה לריפוי • לחיצה על המפה מגדילה אותה'
 : '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> תזוזה • עכבר הסתכלות • קליק שמאלי ירי • קליק ימני כוונת<br><kbd>רווח</kbd> קפיצה (וקפיצה מהמטוס) • <kbd>R</kbd> טעינה • <kbd>E</kbd> פתיחת תיבה / החלפת נשק<br><kbd>1</kbd> מכוש • <kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> נשקים • גלגלת החלפה<br>בנייה: <kbd>Q</kbd> קיר • <kbd>F</kbd> רצפה • <kbd>C</kbd> רמפה • <kbd>V</kbd> גג, ואז קליק לבנות<br><kbd>H</kbd> תחבושת • <kbd>G</kbd> שיקוי מגן • <kbd>M</kbd> מפה גדולה';

// ================= Noise =================
const perm=new Uint8Array(512);{const p=[];for(let i=0;i<256;i++)p.push(i);for(let i=255;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)perm[i]=p[i&255];}
function hash(ix,iz){return perm[(perm[ix&255]+iz)&255]/255;}
function vnoise(x,z){const ix=Math.floor(x),iz=Math.floor(z);const fx=x-ix,fz=z-iz;const ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);const a=hash(ix,iz),b=hash(ix+1,iz),c=hash(ix,iz+1),d=hash(ix+1,iz+1);return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz;}
function fbm(x,z,o){let s=0,a=0.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,z*f);n+=a;a*=0.5;f*=2.03;}return s/n;}

// ================= Renderer / scene =================
const renderer=new THREE.WebGLRenderer({antialias:!isTouch,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,isTouch?1.5:2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
$('game').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xa9c0d6,60,260);
scene.background=new THREE.Color(0xa9c0d6);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1600);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const hemi=new THREE.HemisphereLight(0xbfd8ff,0x5a4a35,0.6);scene.add(hemi);
const keyLight=new THREE.DirectionalLight(0xfff2dd,2.5);keyLight.castShadow=true;
keyLight.shadow.mapSize.set(isTouch?1024:2048,isTouch?1024:2048);
{const sc=keyLight.shadow.camera;sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=1;sc.far=500;}
keyLight.shadow.bias=-0.0006;keyLight.shadow.normalBias=0.04;
scene.add(keyLight);scene.add(keyLight.target);

function canvasTex(w,h,draw,rep,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(rep)t.repeat.set(rep,rep);return t;}
const stdMat=(color,o={})=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:0.85,metalness:0},o));

const SND={ar:{f:2400,d:0.13,v:0.5,th:90},smg:{f:3200,d:0.08,v:0.35,th:0},shotgun:{f:1300,d:0.35,v:0.75,th:70},sniper:{f:1900,d:0.6,v:0.9,th:55},pick:{f:700,d:0.07,v:0.35,th:0},build:{f:500,d:0.12,v:0.35,th:140},chest:{f:3000,d:0.25,v:0.3,th:600}};

 if(v.bandages>0)drop('bandage',{n:v.bandages});if(v.shieldPots>0)drop('shield',{n:v.shieldPots});
 if(v.mats.wood+v.mats.stone>0)drop('mats',{wood:v.mats.wood,stone:v.mats.stone});

 if(killer){killer.kills++;killfeed(`${killer.isPlayer?'אתה':killer.name} חיסל את ${v.isPlayer?'אותך':v.name} • ${wname}`);}
 else killfeed(`${v.isPlayer?'אתה':v.name} נבלע בסערה`);

function fireWeapon(f,origin,dir,spread){

  applySpread(dir,spread,_sd);const res=castRay(origin,_sd,W.range,true,f);
  _end.copy(origin).addScaledVector(_sd,res.t);if(p<3||f.isPlayer)spawnTracer(_mz,_end);

 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(state==='menu'){menuA+=dt*0.05;camera.position.set(Math.cos(menuA)*170,90,Math.sin(menuA)*170);camera.lookAt(0,10,0);sky.position.copy(camera.position);stars.position.copy(camera.position);sunDisc.position.copy(camera.position).addScaledVector(sunDir,900);moonDisc.position.copy(camera.position).addScaledVector(sunDir,-900);planeAt(0,planePos);planeMesh.position.copy(planePos);renderer.render(scene,camera);return;}
 gameTime+=dt;matchTime+=dt;
 // plane
 plane.t=Math.min(plane.dur+30,plane.t+dt);planeAt(plane.t,planePos);planeMesh.position.copy(planePos);planeMesh.lookAt(_t1.copy(planePos).add(plane.dir));planeMesh.visible=plane.t<plane.dur+8;
 if(plane.t>=plane.dur){for(const f of fighters)if(f.phase==='plane')jumpFromPlane(f);}
 updatePlayer(dt);
 for(const f of fighters){if(!f.isPlayer&&f.alive)updateBot(f,dt);}
 updateStorm(dt);
 for(const f of fighters)animate(f,dt);
 // items bob
 for(const it of items){if(!it.alive)continue;it.ph+=dt*2;it.mesh.position.y=it.y+0.45+Math.sin(it.ph)*0.08;it.mesh.userData.inner.rotation.y+=dt*1.2;}
 findNear();
 updateEffects(dt);
 updateSky(190+matchTime,dt,false);
 // fog = player sight
 const sight=sightRange(player);let far=sight*1.05;if(player.phase!=='ground')far=Math.max(far,360);scene.fog.far=lerp(scene.fog.far,far,Math.min(1,dt*2));scene.fog.near=scene.fog.far*0.25;
 updateCamera(dt);
 if(chTimer>0){chTimer-=dt;if(chTimer<=0)$('crosshair').classList.remove('hit','head');}
 if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0){msgTimer=0;$('msg').classList.remove('show');}}
 hudT-=dt;if(hudT<=0){hudT=0.1;updateHUD();drawMinimap();}
 renderer.render(scene,camera);
}
requestAnimationFrame(loop);
})();
